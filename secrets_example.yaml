# Przykładowy plik sekretów do zaszyfrowania przez SOPS
# Użycie:
# 1. Skopiuj ten plik: cp secrets_example.yaml secrets.yaml
# 2. Edytuj sekrety w secrets.yaml
# 3. Zaszyfruj: sops -e secrets.yaml > secrets.enc.yaml
# 4. Zastąp: mv secrets.enc.yaml secrets.yaml
# 5. Odkomentuj mapowanie w sops.tf

devops_sp_username: "your-service-principal-username"
devops_sp_password: "your-service-principal-password"
database_password: "your-database-password"
api_key: "your-api-key"
